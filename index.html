<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор карты камер</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <header class="toolbar">
        <div class="document-status">
          <span id="status" role="status" aria-live="polite">Карта не загружена</span>
          <span class="document-status__separator" aria-hidden="true">·</span>
          <span id="zoom-status">Масштаб: —</span>
        </div>
        <div class="toolbar__actions">
          <label class="button button--primary" for="map-file">Загрузить карту</label>
          <input id="map-file" class="visually-hidden" type="file"
            accept=".png,.jpg,.jpeg,image/png,image/jpeg">
          <button id="fit-button" class="button" type="button" disabled>Показать целиком</button>
        </div>
      </header>

      <div class="editor-layout">
        <aside class="sidebar" aria-label="Панель элементов и свойств">
          <section class="sidebar__section">
            <h2>Элементы</h2>
            <button id="camera-tool" class="element-tool" type="button" aria-pressed="false" disabled>
              <span class="element-tool__icon" aria-hidden="true">
                <svg viewBox="0 0 32 32"><path d="M7 11h12a3 3 0 0 1 3 3v7H10a3 3 0 0 1-3-3v-7Zm15 4 6-3v11l-6-3v-5Z"/></svg>
              </span>
              <span>
                <strong>Камера</strong>
                <small>Добавить на карту</small>
              </span>
            </button>
          </section>

          <section class="sidebar__section camera-list-section">
            <h2>На карте</h2>
            <div id="camera-list" class="camera-list">
              <p class="camera-list__empty">Камер пока нет</p>
            </div>
          </section>

          <section id="camera-properties" class="sidebar__section properties" hidden>
            <div class="properties__heading">
              <h2>Камера</h2>
              <button id="delete-camera" class="icon-button" type="button" title="Удалить камеру" aria-label="Удалить камеру">×</button>
            </div>
            <label class="field">
              <span>Название</span>
              <input id="camera-name" type="text" autocomplete="off">
            </label>
            <label class="field">
              <span>Модель</span>
              <input id="camera-model" type="text" autocomplete="off">
            </label>
            <label class="field">
              <span>IP-адрес</span>
              <input id="camera-ip" type="text" autocomplete="off" inputmode="decimal">
            </label>
            <label class="field">
              <span>MAC-адрес</span>
              <input id="camera-mac" type="text" autocomplete="off">
            </label>
            <div class="field">
              <label for="camera-fov">Горизонтальный угол</label>
              <div class="angle-inputs">
                <input id="camera-fov" type="range" min="1" max="180" value="90">
                <div class="number-with-unit">
                  <input id="camera-fov-number" type="number" min="1" max="180" value="90">
                  <span>°</span>
                </div>
              </div>
            </div>
            <p class="properties__hint">Перетащите камеру для перемещения. Круглый маркер меняет направление.</p>
            <button id="close-properties" class="button button--primary properties__done" type="button">ОК</button>
          </section>
        </aside>

        <section class="workspace-panel" aria-label="Рабочая область карты">
          <div id="workspace" class="workspace" tabindex="0">
            <div id="empty-state" class="empty-state">
              <div class="empty-state__icon" aria-hidden="true">⌗</div>
              <p class="empty-state__title">Карта пока не загружена</p>
              <p class="empty-state__hint">Выберите изображение PNG или JPG</p>
            </div>
            <div id="placement-hint" class="placement-hint" hidden>Щёлкните по карте, чтобы поставить камеру</div>
            <div id="scene" class="scene" hidden>
              <img id="map-image" class="map-layer" alt="Загруженная карта" draggable="false">
              <div id="objects-layer" class="objects-layer"></div>
            </div>
          </div>
        </section>
      </div>
      <div id="error-message" class="message message--error" role="alert" hidden></div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
